<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions - Sports Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <h2>Sports Scheduler</h2>

  <div>
    <button onclick="location.href='/dashboard.html'">Dashboard</button>
    <button onclick="location.href='/my-sessions.html'">My Sessions</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<main class="dashboard">

  <h1>Available Sessions</h1>

  <div id="sessionsContainer" class="dashboard-grid"></div>

</main>

<script>

const token = localStorage.getItem("token");
const user = JSON.parse(localStorage.getItem("user"));

if (!token || !user) {
  location.href = "/";
}

async function loadSessions() {

  try {

    const response = await fetch("/api/sessions", {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    if (!response.ok) {
      alert("Unable to load sessions");
      return;
    }

    const sessions = await response.json();

    const container = document.getElementById("sessionsContainer");

    if (sessions.length === 0) {
      container.innerHTML = "<p>No sessions available.</p>";
      return;
    }

    container.innerHTML = sessions.map(session => {

      const sessionDateTime = new Date(
        `${session.date.substring(0, 10)}T${session.time}`
      );

      const isPast = sessionDateTime < new Date();

      const isCreator = session.createdBy === user.id;

      const isCancelled = session.status === "cancelled";

      let actionButton = "";

      if (isCancelled) {

        actionButton = `
          <p class="error-message">
            This session has been cancelled.
          </p>
        `;

      } else if (isPast) {

        actionButton = `
          <p>
            <strong>Session completed</strong>
          </p>
        `;

      } else if (isCreator) {

        actionButton = `
          <p>
            <strong>Your Session</strong>
          </p>
        `;

      } else {

        actionButton = `
          <button
            class="primary"
            onclick="joinSession(${session.id})">
            Join Session
          </button>
        `;

      }

      return `

        <div class="dashboard-card">

          <h2>${session.title}</h2>

          <p>
            <strong>Sport:</strong>
            ${session.Sport ? session.Sport.name : "Unknown"}
          </p>

          <p>
            <strong>Date:</strong>
            ${session.date.substring(0, 10)}
          </p>

          <p>
            <strong>Time:</strong>
            ${session.time}
          </p>

          <p>
            <strong>Venue:</strong>
            ${session.venue || "Not specified"}
          </p>
          

          <p>
            <strong>Status:</strong>
            ${session.status}
          </p>

          <hr>

          <p>
            <strong>Team 1 Players:</strong>
            ${session.team1Players || "None specified"}
          </p>

          <p>
            <strong>Team 2 Players:</strong>
            ${session.team2Players || "None specified"}
          </p>

          <p>
            <strong>Additional Players Needed:</strong>
            ${session.additionalPlayers ?? "Not specified"}
          </p>
          <p>
  <strong>Joined Players:</strong>
  ${
    session.SessionPlayers && session.SessionPlayers.length > 0
      ? session.SessionPlayers
          .map(player => player.User.name)
          .join(", ")
      : "No players joined yet"
  }
</p>

          <hr>

          ${actionButton}

        </div>

      `;

    }).join("");

  } catch (error) {

    console.error(error);

    document.getElementById("sessionsContainer").innerHTML =
      "<p>Unable to connect to the server.</p>";

  }
}


async function joinSession(id) {

  try {

    const response = await fetch(`/api/sessions/${id}/join`, {

      method: "POST",

      headers: {
        Authorization: "Bearer " + token
      }

    });

    const data = await response.json();

    alert(data.message);

    if (response.ok) {
      window.location.href = "/my-sessions.html";
    }

  } catch (error) {

    console.error(error);

    alert("Unable to join session");

  }

}


function logout() {

  localStorage.clear();

  location.href = "/";

}


loadSessions();

</script>

</body>
</html>
