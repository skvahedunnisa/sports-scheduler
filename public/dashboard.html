<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sports Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <h2>Sports Scheduler</h2>

    <div>
      <button onclick="goToSessions()">Sessions</button>
      <button onclick="goToMySessions()">My Sessions</button>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="dashboard">

    <h1>Welcome, <span id="userName"></span> 👋</h1>

    <p id="userRole"></p>

    <div class="dashboard-grid">

      <div class="dashboard-card">
        <h2>Browse Sessions</h2>
        <p>Find sports sessions and join available games.</p>
        <button class="primary" onclick="goToSessions()">
          View Sessions
        </button>
      </div>

      <div class="dashboard-card">
        <h2>Create Session</h2>
        <p>Create a new sports session and invite players.</p>
        <button class="primary" onclick="createSession()">
          Create Session
        </button>
      </div>

      <div class="dashboard-card">
        <h2>My Sessions</h2>
        <p>View sessions you created and sessions you joined.</p>
        <button class="primary" onclick="goToMySessions()">
          My Sessions
        </button>
      </div>

      <div class="dashboard-card" id="adminCard">
        <h2>Admin</h2>
        <p>Manage sports and view session reports.</p>
        <button class="primary" onclick="goToAdmin()">
            Manage Sports & Reports
        </button>
      </div>

    </div>

  </main>

  <script>
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
      window.location.href = "/";
    }

    document.getElementById("userName").textContent = user.name;
    document.getElementById("userRole").textContent =
      "Role: " + user.role;

    if (user.role !== "admin") {
      document.getElementById("adminCard").style.display = "none";
    }

    function goToSessions() {
      window.location.href = "/sessions.html";
    }

    function goToMySessions() {
      window.location.href = "/my-sessions.html";
    }

    function createSession() {
      window.location.href = "/create-session.html";
    }

    function goToAdmin() {
      window.location.href = "/admin.html";
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "/";
    }
  </script>

</body>
</html>
